# ============================================================================
# Pages CMS Configuration
# Documentation: https://pagescms.org/docs/configuration/
# ============================================================================

# ============================================================================
# MEDIA
# ============================================================================
media:
  - name: images
    label: All Images
    input: src/assets
    output: /src/assets
  - name: blog # Note: 'name' key is required here
    label: Blog Images
    input: src/assets
    output: ../../assets
    path: images/blog
  - name: publications
    label: Publication Files
    input: public/publications
    output: publications

# ============================================================================
# REUSABLE COMPONENTS
#
# Shared building blocks referenced by section components and content
# collections via `component: <name>`.
# ============================================================================
components:
  # --------------------------------------------------------------------------
  # Primitives (button, card, background, link)
  # --------------------------------------------------------------------------

  button:
    type: object
    fields:
      - name: variant
        label: Variant
        type: select
        options:
          values:
            - label: Primary
              value: primary
            - label: Secondary
              value: secondary
        required: true
        default: primary
      - name: size
        label: Size
        type: select
        options:
          values:
            - label: Small
              value: sm
            - label: Medium
              value: md
            - label: Large
              value: lg
        required: true
        default: md
      - name: text
        label: Text
        type: string
        required: true
        description: The text displayed on the button
      - name: href
        label: Link URL
        type: string
        required: true
        description: The URL this button links to

  card:
    type: object
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: content
        label: Content
        type: rich-text
        description: Brief description of the card
      - name: image
        label: Image
        type: image
        description: Card image
      
      - name: color
        label: Color
        type: select
        options:
          values:
            - label: Neutral
              value: neutral
            - label: Primary (Blue)
              value: primary
            - label: Secondary (Yellow)
              value: secondary
            - label: Supporting 1 (Green)
              value: supporting1
            - label: Supporting 2 (Sap Green)
              value: supporting2
            - label: Speed (Purple)
              value: speed
        description: Card color theme
      - name: icon
        label: Icon
        type: select
        options:
          values:
            - label: Measurement
              value: measurement
            - label: Insights
              value: insights
            - label: Community
              value: community
            - label: M-Lab Blue
              value: mlab-blue
            - label: M-Lab White
              value: mlab-white
        description: Card icon (will not show if the card has an image)
      - name: button
        label: Button
        component: button

  background_select:
    type: object
    fields:
      - name: color
        label: Color
        type: select
        options:
          values:
            - label: White
              value: white
            - label: Gray
              value: gray
            - label: Light Blue
              value: primary-light
            - label: Medium Blue
              value: primary-medium
            - label: Dark Blue
              value: primary-dark
            - label: Light Purple
              value: speed-light
            - label: Dark Purple
              value: speed-dark
        default: white
        description: Select a section background for this section
      - name: type
        label: Type
        type: select
        options:
          values:
            - label: Full-width
              value: full
            - label: Contained
              value: contained
        default: full
        description: Select the background type for this section

  flexible_link:
    type: block
    blockKey: type
    description: Link that can reference an internal page or external URL
    blocks:
      - name: internal
        label: Internal Page Link
        fields:
          - name: label
            label: Link Label
            type: string
            required: true
            description: Text displayed for the link
          - name: pageRef
            label: Page Reference
            type: reference
            required: true
            options:
              collection: pages
              value: '{permalink}'
              label: '{permalink} ({title})'
            description: Select a page from the pages collection
          - name: description
            label: Description
            type: string
            description: Optional description for accessibility

      - name: external
        label: External Link
        fields:
          - name: label
            label: Link Label
            type: string
            required: true
            description: Text displayed for the link
          - name: externalUrl
            label: External URL
            type: string
            required: true
            description: Full URL (e.g. https://example.com)
            pattern:
              message: 'Must be a valid URL starting with http:// or https://'
              regex: '^https?://.+'
          - name: description
            label: Description
            type: string
            description: Optional description for accessibility

  # --------------------------------------------------------------------------
  # Data-entry components (person, partner)
  # --------------------------------------------------------------------------

  person:
    type: object
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier (slug format, e.g. john-doe)
      - name: name
        label: Name
        type: string
        required: true
      - name: headshot
        label: Headshot
        type: image
        required: true
      - name: affiliation
        label: Affiliation
        type: string
        required: false
      - name: extraInfo
        label: Other/Previous Affiliations
        type: string
        required: false
      - name: url
        label: Link
        type: string
        required: false
        description: Optional external link
      - name: title
        label: Role
        type: string
        required: false
      - name: sections
        label: Sections
        type: string
        list: true
        description: Department/section tags (e.g. Leadership, Engineering)

  partner:
    type: object
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: affiliation
        label: Affiliation
        type: string
        description: e.g. "Platinum Sponsor"
      - name: url
        label: Website URL
        type: string
        description: Partner's website
      - name: category
        label: Category
        type: string
        required: true
        description: e.g. sponsor, infrastructure, community
      - name: image
        label: Logo
        type: image
        required: true
        description: Absolute path to partner logo (e.g. /src/assets/partners/logo.png)

  # --------------------------------------------------------------------------
  # Navigation
  # --------------------------------------------------------------------------

  navigation_menu_item:
    type: block
    blockKey: type
    description: Navigation item that can be a single link or a dropdown menu with multiple links
    blocks:
      - name: single
        label: Single Link
        fields:
          - name: link
            label: Link
            component: flexible_link
            required: true
            description: A single navigation link

      - name: dropdown
        label: Dropdown Menu
        fields:
          - name: label
            label: Menu Label
            type: string
            required: true
            description: Text displayed for the dropdown menu
          - name: links
            label: Menu Links
            component: flexible_link
            list: true
            required: true
            description: List of links in the dropdown menu

  # --------------------------------------------------------------------------
  # Section components
  #
  # Each *_section component defines the CMS fields for a page section type.
  # These are referenced as blocks inside page/homepage `sections` fields.
  # --------------------------------------------------------------------------

  # -- Hero (pages only, not homepage) --
  hero_section:
    type: object
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: backgroundImage
        label: Background Image
        type: image
        description: Optional hero background image
      - name: zigzag
        label: Zigzag Pattern
        type: select
        options:
          values:
            - label: Primary Light
              value: primary-light
            - label: Primary Dark
              value: primary-dark
            - label: Secondary Light
              value: secondary-light
            - label: Secondary Dark
              value: secondary-dark
            - label: Supporting 1 Light
              value: supporting1-light
            - label: Supporting 1 Dark
              value: supporting1-dark
            - label: Supporting 2 Light
              value: supporting2-light
            - label: Supporting 2 Dark
              value: supporting2-dark
            - label: Speed Light
              value: speed-light
            - label: Speed Dark
              value: speed-dark
        description: Decorative zigzag pattern style for the hero section

  # -- Rich Text --
  richtext_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: withTOC
        label: Include Table of Contents
        type: boolean
        default: false
      - name: content
        label: Content
        type: rich-text
        required: true
        description: Markdown content for this section

  # -- Button --
  button_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title (Optional)
        type: string
        required: false
      - name: buttons
        label: Buttons
        component: button
        list: true

  # -- Card --
  card_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: cards
        label: Cards
        component: card
        list: true
        description: Grid of content cards
      - name: buttons
        label: Action Buttons
        component: button
        list: true
        description: Buttons at the bottom of the section

  # -- Flexi (container for nested sections) --
  flexi_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: sections
        label: Nested Sections
        component: section
        list: true
        description: Nested sections within this flexi section

  # Subset of section types allowed inside flexi sections
  section:
    type: block
    blockKey: type
    description: Add and arrange page sections in any order
    blocks:
      - name: richText
        label: Rich Text Section
        component: richtext_section
      - name: button
        label: Button Section
        component: button_section
      - name: card
        label: Card Section
        component: card_section

  # -- People --
  people_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: category
        label: Category
        type: select
        options:
          # pages-cms:category-sync start people
          values:
            - Maintainers
            - Experiment Review Committee
            - Advisory Committee
            - M-Lab Founders
            - Alumni
            - Community
          # pages-cms:category-sync end
        description: Filter people by section. Leave empty to show all people. Options come from the People category group under Categories.

  # -- Partners --
  partners_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        options:
          # pages-cms:category-sync start partners
          values:
            - Supporting Research Projects
            - Supporting Partners
            - OMG Partners
            - BYOS Partners
            - IMC Hackathon Partners
          # pages-cms:category-sync end
        description: Filter partners by category. Leave empty to show all partners. Options come from the Partners category group under Categories.

  # -- Blog Roll --
  blog_roll_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        default: Latest News
      - name: description
        label: Description
        type: rich-text
      - name: limit
        label: Number of Posts
        type: number
        default: 3
        description: How many blog posts to show (1-12)
      - name: showMore
        label: Show "More" Button
        type: boolean
        default: false
        description: Display a link to the full blog

  # -- Related Posts --
  related_posts_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        default: Related Posts
      - name: description
        label: Description
        type: rich-text
        required: false
        description: Optional description displayed below the title
      - name: posts
        label: Posts
        type: reference
        description: Pick up to 3 blog posts to feature, in the order you want them shown
        options:
          collection: blog
          required: false
          multiple: true
          value: '{permalink}'
          label: '{title}'
          image: '{fields.heroImage}'

  # -- Tests --
  tests_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        default: Tests
      - name: description
        label: Description
        type: rich-text
        required: false
        description: Optional description displayed below the title
      - name: tests
        label: Tests
        type: reference
        description: Pick the tests to feature, in the order you want them shown
        options:
          collection: tests
          required: false
          multiple: true
          value: '{permalink}'
          label: '{title}'
          image: '{fields.icon}'

  # -- Infrastructure Map --
  infrastructure_map_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        default: Infrastructure Map
        description: Title displayed above the map
      - name: description
        label: Description
        type: rich-text
        description: Optional description displayed below the title

  # -- Speed Test (homepage only) --
  speed_test_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text

  # -- Featured Partners (homepage only) --
  featured_partners_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text

# ============================================================================
# CONTENT COLLECTIONS
# ============================================================================
content:
  # --------------------------------------------------------------------------
  # Homepage (singleton)
  # --------------------------------------------------------------------------
  - name: homepage
    label: Homepage
    type: file
    path: src/content/homepage/index.yaml
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: backgroundImage
        label: Background Image
        type: image
      - name: stats
        label: Stats
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: value
            label: Value
            type: string
            required: true
        description: Key statistics to display in the hero section
      - name: sections
        label: Page Sections
        type: block
        list: true
        required: true
        blockKey: type
        description: Add and arrange page sections in any order
        blocks:
          - name: richText
            label: Rich Text Section
            component: richtext_section
          - name: button
            label: Button Section
            component: button_section
          - name: card
            label: Card Section
            component: card_section
          - name: people
            label: People Section
            component: people_section
          - name: partners
            label: Partners Section
            component: partners_section
          - name: flexi
            label: Flexi Section
            component: flexi_section
          - name: blog_roll
            label: Blog Roll Section
            component: blog_roll_section
          - name: related_posts
            label: Related Posts Section
            component: related_posts_section
          - name: tests
            label: Tests Section
            component: tests_section
          - name: speed_test
            label: Speed Test Section
            component: speed_test_section
          - name: featured_partners
            label: Featured Partners Section
            component: featured_partners_section
          - name: infrastructureMap
            label: Infrastructure Map Section
            component: infrastructure_map_section

  # --------------------------------------------------------------------------
  # Pages
  # --------------------------------------------------------------------------
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    format: yaml
    filename: '{fields.permalink}.yaml'
    view:
      fields: [title, description, status]
      primary: title
    fields:
      - name: title
        label: Page Title
        type: string
        required: true
        description: The title of the page
      - name: permalink
        label: Permalink
        type: string
        description: The slug, without slashes or parents, like 'about-us' or 'omg-3'.
        pattern:
          {
            message: "This must be a web-safe string like 'about-us' or 'omg-3'.",
            regex: '^[a-zA-Z0-9_-]*$',
          }
        required: true
      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible on the preview site. New content defaults to Draft.
      - name: description
        label: Page Description
        type: rich-text
        description: SEO meta description
      - name: heroImage
        label: Hero Image
        type: image
        description: Background image for the page hero. When set, the zigzag pattern is not shown.
      - name: zigzag
        label: Zigzag Pattern
        type: select
        options:
          values:
            - label: Primary Light
              value: primary-light
            - label: Primary Dark
              value: primary-dark
            - label: Secondary Light
              value: secondary-light
            - label: Secondary Dark
              value: secondary-dark
            - label: Supporting 1 Light
              value: supporting1-light
            - label: Supporting 1 Dark
              value: supporting1-dark
            - label: Supporting 2 Light
              value: supporting2-light
            - label: Supporting 2 Dark
              value: supporting2-dark
            - label: Speed Light
              value: speed-light
            - label: Speed Dark
              value: speed-dark
        description: Decorative zigzag pattern applied to the page hero. Used when no hero image is set.
      - name: sections
        label: Page Sections
        type: block
        list: true
        blockKey: type
        description: Add and arrange page sections in any order
        blocks:
          - name: hero
            label: Hero Section
            component: hero_section
          - name: richText
            label: Rich Text Section
            component: richtext_section
          - name: button
            label: Button Section
            component: button_section
          - name: card
            label: Card Section
            component: card_section
          - name: people
            label: People Section
            component: people_section
          - name: partners
            label: Partners Section
            component: partners_section
          - name: flexi
            label: Flexi Section
            component: flexi_section
          - name: blog_roll
            label: Blog Roll Section
            component: blog_roll_section
          - name: related_posts
            label: Related Posts Section
            component: related_posts_section
          - name: tests
            label: Tests Section
            component: tests_section
          - name: infrastructureMap
            label: Infrastructure Map Section
            component: infrastructure_map_section

  # --------------------------------------------------------------------------
  # Blog
  # --------------------------------------------------------------------------
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    filename: '{fields.permalink}.md'
    subfolders: false
    view:
      fields: [heroImage, title, publishedDate, status]
      primary: title
      sort: [publishedDate, title]
      search: [title]
      default:
        search: ''
        sort: publishedDate
        order: desc
    fields:
      - name: permalink
        label: Permalink
        type: string
        required: true
        description: URL-friendly identifier (e.g. my-blog-post-title)
        pattern:
          {
            message: "Must be a web-safe string like 'my-blog-post-title'.",
            regex: '^[a-zA-Z0-9_-]*$',
          }
      - name: title
        label: Title
        type: string
        required: true
        description: Blog post title
      - name: excerpt
        label: Excerpt
        type: text
        description: Short summary of the blog post
      - name: authors
        label: Authors
        type: reference
        required: false
        default: []
        options:
          collection: people
          required: false
          multiple: true
          value: '{id}'
          label: '{fields.name}'
      - name: externalAuthors
        label: External Authors
        type: string
        required: false
        description: Add any external authors here
      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible on the preview site. New content defaults to Draft.
      - name: publishedDate
        label: Published Date
        type: date
        options:
          format: yyyy-MM-dd
        required: true
        description: Date the blog post was published
      - name: heroImage
        label: Hero Image
        type: image
        options:
          media: blog
        description: Featured image for the blog post
      - name: relatedPosts
        label: Related Posts
        type: reference
        description: Select up to 3 related blog posts
        options:
          collection: blog
          required: false
          multiple: true
          value: '{permalink}'
          label: '{title}'
          image: '{fields.heroImage}'
      - name: categories
        label: Categories
        type: select
        required: true
        options:
          multiple: true
          # pages-cms:category-sync start blog
          values:
            - Accuracy
            - Advocacy
            - Aim
            - Analysis
            - Annotations
            - Announcement
            - Annual Review
            - BBR
            - Bigquery
            - Broadband
            - Bufferbloat
            - Bug
            - Censorship Measurement
            - Cloud
            - Cloudflare
            - Community
            - Consumer Internet
            - Contribution
            - Covid19
            - Data
            - Data Analysis
            - DataViz
            - Developer
            - Digital Inclusion
            - Event
            - Experiment Review Committee
            - Features
            - Fellowship
            - GCS
            - GDPR
            - GIS
            - Governance
            - GSOC
            - Guest
            - Hackathon
            - IGF
            - Infrastructure
            - Interconnection
            - Internet Quality
            - Kernel
            - Latency
            - Leadership
            - Learning
            - Mapping
            - Microbursts
            - NDT
            - NDT Server
            - Ndt5
            - NDT7
            - Neubot
            - Observatory
            - Ookla
            - Open Source
            - Paris Traceroute
            - Partnership
            - Performance
            - Pipeline
            - Platform
            - Policies
            - Policy
            - Privacy
            - Publication
            - Publications
            - Research
            - Responsiveness
            - RIPE
            - Roadmap
            - Schema
            - Speed
            - Statistics
            - Survey
            - Switch Discard
            - TCP
            - TCP_INFO
            - ToS
            - Traceroute
            - Traffic Congestion
            - Transparency
            - Tutorial
            - Upgrades
            - Versioning
            - Virtualization
            - Visualization
            - Web100
            - Wehe
          # pages-cms:category-sync end
      - name: body
        label: Body
        type: rich-text
        options:
          media: blog

  # --------------------------------------------------------------------------
  # People
  # --------------------------------------------------------------------------
  - name: people
    label: People
    type: collection
    path: src/content/people
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [headshot, name, title, affiliation, status]
      primary: name
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier (slug format, e.g. john-doe)
      - name: name
        label: Name
        type: string
        required: true
      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible on the preview site. New content defaults to Draft.
      - name: headshot
        label: Headshot
        type: image
        options:
          media: images
          path: people
        required: true
      - name: title
        label: Role
        type: string
        required: false
      - name: affiliation
        label: Affiliation
        type: string
        required: false
      - name: extraInfo
        label: Other/Previous Affiliations
        type: string
        required: false
      - name: url
        label: Link
        type: string
        required: false
        description: Optional external link
      - name: sections
        label: Sections
        type: select
        required: true
        options:
          multiple: true
          # pages-cms:category-sync start people
          values:
            - Maintainers
            - Experiment Review Committee
            - Advisory Committee
            - M-Lab Founders
            - Alumni
            - Community
          # pages-cms:category-sync end

  # --------------------------------------------------------------------------
  # Partners
  # --------------------------------------------------------------------------
  - name: partners
    label: Partners
    type: collection
    path: src/content/partners
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [image, name, affiliation, status]
      sort: [name]
      search: [name, affiliation]
      primary: name
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier (slug format, e.g. tech-corp)
      - name: name
        label: Partner Name
        type: string
        required: true
      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible on the preview site. New content defaults to Draft.
      - name: affiliation
        label: Affiliation
        type: string
      - name: url
        label: Website URL
        type: string
      - name: category
        label: Categories
        type: select
        required: true
        description: A partner can belong to more than one category.
        options:
          multiple: true
          # pages-cms:category-sync start partners
          values:
            - Supporting Research Projects
            - Supporting Partners
            - OMG Partners
            - BYOS Partners
            - IMC Hackathon Partners
          # pages-cms:category-sync end
      - name: image
        label: Logo
        type: image
        description: Absolute path to partner logo (e.g. /src/assets/partners/logo.png)

  # --------------------------------------------------------------------------
  # Categories
  # --------------------------------------------------------------------------
  - name: categories
    label: Categories
    type: collection
    path: src/content/categories
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [name, id]
      primary: name
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier (e.g. people, partners, blog)
      - name: name
        label: Name
        type: string
        required: true
        description: Display name for this category group
      - name: categories
        label: Categories
        type: string
        list: true
        required: true

  # --------------------------------------------------------------------------
  # Tests
  # --------------------------------------------------------------------------
  - name: tests
    label: Tests
    type: collection
    path: src/content/tests
    format: yaml-frontmatter
    filename: '{fields.slug}.md'
    subfolders: true
    view:
      layout: tree
      node:
        filename: index.md
        hideDirs: nodes
      fields: [icon, title, testStatus, status, order]
      sort: [order, title]
      primary: title
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly identifier (e.g. ndt, wehe, traceroute)
        pattern:
          {
            message: "Must be a web-safe string like 'ndt' or 'reverse_traceroute'.",
            regex: '^[a-zA-Z0-9_-]*$',
          }
      - name: permalink
        label: Permalink
        type: string
        required: true
        description: Full URL path (e.g. /tests/ndt/)
      - name: title
        label: Title
        type: string
        required: true
        description: Display name of the test
      - name: description
        label: Description
        type: text
        description: Brief description of what the test measures
      - name: testStatus
        label: Test Status
        type: select
        default: current
        options:
          values:
            - label: Current
              value: current
            - label: Core Service
              value: core-service
            - label: Retired
              value: retired
            - label: Retired Core Service
              value: retired-core-service
        description: The operational status of this test on the M-Lab platform
      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible on the preview site. New content defaults to Draft.
      - name: icon
        label: Icon
        type: image
        description: Test icon image (e.g. /src/assets/images/tests/ndt.png)
      - name: order
        label: Display Order
        type: number
        description: Order in which the test appears in listings (lower numbers first)
      - name: body
        label: Content
        type: rich-text
        description: Full documentation for the test

  # --------------------------------------------------------------------------
  # Knowledge Base
  # --------------------------------------------------------------------------
  - name: kb
    label: Knowledge Base
    type: collection
    path: src/content/kb
    format: yaml-frontmatter
    filename: '{fields.permalink}.md'
    subfolders: false
    view:
      fields: [title, chapter, order, status]
      primary: title
      sort: [chapterOrder, order, title]
      default:
        sort: chapterOrder
        order: asc
    fields:
      - name: permalink
        label: Permalink
        type: string
        required: true
        description: URL-friendly identifier. The article is served at /kb/<permalink>.
        pattern:
          {
            message: "Must be a web-safe string like 'getting-started-bigquery'.",
            regex: '^[a-zA-Z0-9_-]*$',
          }
      - name: title
        label: Title
        type: string
        required: true
      - name: chapter
        label: Chapter
        type: string
        required: true
        description: Chapter heading in the knowledge base sidebar (e.g. Getting Started). Must match the other articles of the chapter exactly.
      - name: chapterOrder
        label: Chapter Order
        type: number
        required: true
        description: Position of the whole chapter in the sidebar (1, 2, 3...). Use the same number on every article of a chapter.
      - name: order
        label: Page Order
        type: number
        required: true
        description: Position of this article within its chapter (1, 2, 3...)
      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible on the preview site. New content defaults to Draft.
      - name: description
        label: Description
        type: text
        description: Short summary shown under the page title and in search results
      - name: tags
        label: Tags
        type: string
        list: true
        description: Keywords readers can filter by on the /kb landing page. Does not affect reading order.
      - name: difficulty
        label: Difficulty
        type: select
        options:
          values:
            - label: Beginner
              value: beginner
            - label: Intermediate
              value: intermediate
            - label: Advanced
              value: advanced
        description: Shown as a badge under the title, and filterable on the /kb landing page
      - name: body
        label: Content
        type: rich-text

  # --------------------------------------------------------------------------
  # Publications
  # --------------------------------------------------------------------------
  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [title, category, year, status]
      sort: [year, title]
      search: [title, authors, description]
      primary: title
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier (e.g. 2022-the-ukrainian-internet)
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible on the preview site. New content defaults to Draft.
      - name: description
        label: Description
        type: rich-text
        description: Brief summary of the publication (supports markdown)
      - name: authors
        label: Authors
        type: string
        description: Official citation string (e.g. "Jane Doe, John Smith")
      - name: contributors
        label: M-Lab Contributors
        type: reference
        options:
          collection: people
          required: false
          multiple: true
          value: '{id}'
          label: '{fields.name}'
        description: Link to people in the M-Lab team
      - name: year
        label: Year
        type: number
        required: true
        description: Publication year
      - name: category
        label: Category
        type: select
        required: true
        options:
          multiple: false
          # pages-cms:category-sync start publications
          values:
            - paper
            - regulatory-filing
            - presentation
            - documentation
          # pages-cms:category-sync end
      - name: internalLinks
        label: Internal Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: path
            label: File
            type: file
            required: true
            options:
              media: publications
            description: Upload or select a file from the publications folder
      - name: externalLinks
        label: External Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
            description: Full URL (e.g. https://example.com/paper.pdf)
      - name: videoLinks
        label: Video Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - label: YouTube
                  value: youtube
                - label: Vimeo
                  value: vimeo
                - label: Livestream
                  value: livestream
                - label: Other
                  value: other
      - name: publishedDate
        label: Published Date
        type: date
        options:
          format: yyyy-MM-dd
        description: Exact publication date (optional, year is used for sorting)
      - name: venue
        label: Venue
        type: string
        description: Conference, journal, or event name
      - name: tags
        label: Tags
        type: string
        list: true
  # --------------------------------------------------------------------------
  # Datasets (Data Catalog)
  #
  # Fields intentionally OMITTED from this form (pre-populated for all
  # M-Lab datasets at render time):
  #   dc:creator / dc:publisher  → "Measurement Lab"
  #   dc:language                → "en"
  #   dc:type                    → "Dataset"
  #   dc:rights / license        → "CC0 1.0 Universal"
  #   dc:subject                 → Internet measurement, Network performance,
  #                                 Broadband, Open data
  # --------------------------------------------------------------------------
  - name: datasets
    label: Datasets
    type: collection
    path: src/content/datasets
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [title, updateFrequency, status]
      sort: [title]
      search: [title, description, keywords]
      primary: title
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: URL-safe identifier (e.g. ndt, wehe, traceroute). Becomes the page path /datasets/<id>/.
        pattern:
          message: "Must be a URL-safe string like 'ndt' or 'my-dataset'."
          regex: '^[a-zA-Z0-9_-]+$'

      - name: title
        label: Dataset Name
        type: string
        required: true
        description: Full human-readable name of the dataset (dc:title)

      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft datasets are only visible on the preview site.

      - name: description
        label: Description
        type: text
        required: true
        description: "Plain-text description of what this dataset contains and how it was collected. Used in search results and as dc:description / schema.org description. (Tip: 2–4 sentences works well.)"

      - name: keywords
        label: Keywords
        type: string
        list: true
        description: "Dataset-specific search terms (e.g. 'TCP throughput', 'NDT', 'video streaming'). M-Lab base terms (Internet measurement, Network performance, Broadband, Open data) are added automatically."

      - name: category
        label: Data Category
        type: select
        required: false
        options:
          # pages-cms:category-sync start datasets
          values:
            - label: Enriched Datasets
              value: enriched
            - label: Raw Datasets
              value: raw
            - label: Other Datasets
              value: uncategorized
          # pages-cms:category-sync end
        description: "Raw = unprocessed archives on GCS. Enriched = parsed, annotated, queryable via BigQuery. Leave empty to group the dataset under Other Datasets."

      - name: testRef
        label: Related Test
        type: reference
        required: false
        options:
          collection: tests
          value: '{fields.slug}'
          label: '{title}'
        description: The M-Lab test that generates this dataset (links the dataset page to the test page)

      - name: relatedDatasets
        label: Related Datasets
        type: reference
        required: false
        options:
          collection: datasets
          multiple: true
          value: '{id}'
          label: '{title}'
        description: Other datasets that are closely related (e.g. protocol variants, companion datasets)

      - name: temporalCoverageStart
        label: Coverage Start Date
        type: string
        required: false
        description: "ISO 8601 date when data collection began (e.g. 2009-01-01)"
        pattern:
          message: "Must be an ISO date like 2009-01-01"
          regex: '^\d{4}-\d{2}-\d{2}$'

      - name: temporalCoverageEnd
        label: Coverage End Date
        type: string
        required: false
        description: "ISO 8601 end date, or the word 'present' if collection is ongoing"

      - name: spatialCoverage
        label: Spatial Coverage
        type: string
        required: false
        default: Global
        description: "Geographic scope of the data (default: Global)"

      - name: updateFrequency
        label: Update Frequency
        type: select
        required: false
        options:
          values:
            - label: Continuous (real-time)
              value: continuous
            - label: Daily
              value: daily
            - label: Weekly
              value: weekly
            - label: Monthly
              value: monthly
            - label: Irregular
              value: irregular
            - label: Static (no further updates)
              value: static
        description: How often new measurements are added to this dataset

      - name: dataSize
        label: Approximate Size
        type: string
        required: false
        description: "Human-readable size hint (e.g. '~2 TB/year (raw), ~500 GB/year (parsed)')"

      - name: accessPoints
        label: Access Points
        type: object
        list: true
        description: Ways to access or download this dataset (BigQuery tables, GCS buckets, download URLs, etc.)
        fields:
          - name: label
            label: Label
            type: string
            required: true
            description: "Short display name (e.g. 'BigQuery', 'GCS', 'Download')"
          - name: url
            label: URL or Path
            type: string
            required: true
            description: "Full URL (https://…) or GCS path (gs://…)"
          - name: format
            label: Format
            type: string
            required: true
            description: "Data format (e.g. BigQuery, Parquet, CSV, JSON)"
          - name: type
            label: Type
            type: select
            required: false
            options:
              values:
                - label: Query (interactive)
                  value: query
                - label: Download
                  value: download
                - label: API
                  value: api
                - label: Visualization
                  value: viz
          - name: description
            label: Description
            type: string
            required: false
            description: Brief explanation of what this access point provides

      - name: documentationLinks
        label: Documentation Links
        type: object
        list: true
        description: Links to data documentation, schemas, acceptable use policy, etc.
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true

  # --------------------------------------------------------------------------
  # Site Settings (singleton)
  # --------------------------------------------------------------------------
  - name: site-config
    label: Site Settings
    type: file
    path: src/content/site/config.json
    fields:
      - name: title
        label: Site Title
        type: string
        required: true
        description: The name of your website
      - name: description
        label: Site Description
        type: string
        required: true
        description: Default meta description for SEO
      - name: url
        label: Site URL
        type: string
        required: true
        description: Your website's URL (e.g. https://example.com)
      - name: favicon
        label: Favicon Path
        type: string
        default: /favicon.svg
        description: Path to your favicon file
      - name: defaultOgImage
        label: Default Open Graph Image
        type: image
        description: Default image for social media sharing
      - name: social
        label: Social Media Links
        type: object
        fields:
          - name: bluesky
            label: BlueSky URL
            type: string
            description: Full URL to your Bluesky profile
          - name: mastodon
            label: Mastodon URL
            type: string
            description: Full URL to your Mastodon profile
          - name: github
            label: GitHub URL
            type: string
            description: Full URL to your GitHub profile or organization
          - name: linkedin
            label: LinkedIn URL
            type: string
            description: Full URL to your LinkedIn profile or company page
          - name: x
            label: X URL
            type: string
            description: Full URL to your X profile
          - name: facebook
            label: Facebook URL
            type: string
            description: Full URL to your Facebook page
          - name: instagram
            label: Instagram URL
            type: string
            description: Full URL to your Instagram profile
          - name: youtube
            label: YouTube URL
            type: string
            description: Full URL to your YouTube channel
      - name: archivedBanner
        label: Archived Banner
        type: object
        description: Banner shown on archived pages
        fields:
          - name: message
            label: Message
            type: string
            required: true
            description: Text displayed in the archived page banner
          - name: color
            label: Color
            type: select
            required: true
            default: secondary
            options:
              values:
                - label: Primary (Blue)
                  value: primary
                - label: Secondary (Yellow)
                  value: secondary
                - label: Supporting 1 (Green)
                  value: supporting1
                - label: Supporting 2 (Sap Green)
                  value: supporting2
                - label: Neutral (Gray)
                  value: neutral
                - label: Speed (Purple)
                  value: speed
            description: Color palette for the banner
      - name: cookieConsent
        label: Cookie Consent
        type: object
        description: Cookie banner and analytics settings
        fields:
          - name: message
            label: Banner Message
            type: rich-text
            required: true
            description: Message shown in the cookie consent banner (supports markdown)
          - name: googleAnalyticsId
            label: Google Analytics Measurement ID
            type: string
            description: "GA4 Measurement ID (e.g. G-XXXXXXXXXX). Leave empty to disable analytics."
      - name: footer
        label: Footer
        type: object
        description: Footer content settings
        fields:
          - name: description
            label: Description
            type: rich-text
            description: Short description shown in the footer (supports markdown links)
          - name: bottom
            label: Bottom Text
            type: rich-text
            description: Text shown at the bottom of the footer (supports markdown links)

  # --------------------------------------------------------------------------
  # Redirects (singleton)
  # --------------------------------------------------------------------------
  - name: redirects
    label: Redirects
    type: file
    path: src/content/site/_redirects.json
    fields:
      - name: redirects
        label: Redirects
        type: object
        list: true
        fields:
          - name: from
            label: From Path
            type: string
            required: true
            description: 'Old URL path without leading slash (e.g., old-page or blog/old-post)'
          - name: to
            label: To Path/URL
            type: string
            required: true
            description: 'New path without leading slash (e.g., new-page) or full external URL (https://...)'
          - name: status
            label: Status Code
            type: select
            default: 301
            options:
              values:
                - label: '301 - Permanent Redirect'
                  value: 301
                - label: '302 - Temporary Redirect'
                  value: 302
            description: '301 for permanent moves, 302 for temporary redirects'

  # --------------------------------------------------------------------------
  # Navigation Menus
  # --------------------------------------------------------------------------
  - name: navigation
    label: Navigation Menus
    type: collection
    path: src/content/navigation
    format: json
    filename: '{{fields.slug}}.json'
    subfolders: false
    view:
      fields: [title]
      primary: title
    fields:
      - name: slug
        label: Menu ID
        type: string
        required: true
        description: Unique identifier for this menu (e.g. main, footer-1, footer-2)
        pattern:
          {
            message: "Must be a web-safe string like 'main' or 'footer-1'.",
            regex: '^[a-zA-Z0-9_-]*$',
          }
      - name: title
        label: Menu Title
        type: string
        required: true
        description: Display title for this menu
      - name: items
        label: Menu Items
        component: navigation_menu_item
        list: true
        required: true
