      # The Connectivity Community of Practice


      In 2026, Measurement Lab (M-Lab) and Giga UNCIEF launched the Connectivity
      Community of Practice for applied Internet measurement. 


      As the world’s largest open collection of Ιnternet performance data, M-Lab
      provides powerful, real-world telemetry that helps illuminate how networks
      actually perform. Through this collaboration, we’re working with Giga to
      strengthen how connectivity is measured and understood for public
      facilities, especially schools, using open measurement approaches that
      reflect on-the-ground conditions.


      Giga is a joint initiative of UNICEF and the International
      Telecommunication Union (ITU), working to connect every school to the
      internet and every young person to information, opportunity, and choice.
      Through its global focus on school connectivity, Giga supports governments
      and partners with data, technical expertise, and financing tools to
      accelerate meaningful access to the internet for education.


      ## Objectives


      This Community of Practice (CoP) builds on that shared foundation. It
      brings together researchers, network engineers, implementers, and
      policymakers to advance measurement approaches that are:


      ```

      •	Technically rigorous  

      •	Globally comparable  

      •	Practical for real-world connectivity contexts, including underserved
      regions

      ```


      Together, the community will first explore what meaningful measurement
      looks like for schools, align on indicators that support better
      decision-making, and translate open telemetry into insights that enable
      smarter, evidence-based connectivity planning. 


      At its core, the CoP reflects a shared commitment to openness in data, in
      tools, and in collaboration. As the community grows, we look forward to
      shaping inclusive participation and governance models with contributors,
      ensuring this work remains durable, representative, and grounded in shared
      priorities.


