    content: >+
      ## **Open Internet Measurement**


      When the Internet fails, most people are left guessing why.


      Measurement Lab exists to change that.


      M-Lab is a global, open source project that makes Internet performance
      transparent. It offers a verifiable measurement platform, maintains one of
      the world’s largest open datasets on network performance, and creates
      tools that help people understand and improve how the Internet works.


      ## **Why M-Lab?**


      Rigorous scientific research depends on transparency and verifiable
      methods. M-Lab is designed with this principle at its core, actively
      encouraging collaboration, review, and scrutiny.


      All data collected through M-Lab’s global measurement platform is openly
      available, and all associated tools are open source. This allows
      researchers, practitioners, and the wider public to examine, validate, and
      improve the methodologies and assumptions that underpin the platform.


      By prioritizing transparency and peer review, M-Lab supports more reliable
      measurement and, in turn, a deeper and more accurate understanding of how
      the Internet performs.


      ## **An Open Platform for Researchers**


      M-Lab assists scientific research by providing widely distributed servers
      and ample connectivity for researchers' use. Each researcher-developed
      test is allocated dedicated resources on the M-Lab platform to facilitate
      accurate measurements. Server-side tools are openly licensed and operated,
      allowing third parties to develop their own client-side measurement
      software.


      ## **Better Open Data for Everyone**


      All data collected via M-Lab is made publicly available. M-Lab's
      historical data archive provides a common pool of historical network
      measurement information that anyone may use and serves as a data source
      enabling consumers, operators, regulators, researchers, and civil society
      to understand the state and quality of the Internet.

