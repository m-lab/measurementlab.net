    title: M-Lab's Mission
    description: M-Lab aims to advance Internet research by empowering consumers
      with useful information about their Internet performance. By providing
      free, open Internet measurement data, researchers, regulators, advocacy
      groups, and the general public can get a better sense of how the Internet
      is working for them, and how to maintain and improve it for the future.
