    content: >-
      ## What is the history of M-Lab?


      In 2008, [Vint Cerf](http://www.google.com/corporate/execs.html#vint), one
      of the "fathers of the Internet," began a series of conversations with
      Internet researchers to learn more about challenges they faced while
      trying to study Internet performance. Researchers identified several
      problems, including a lack of widely deployed servers with ample
      connectivity to support Internet measurement experiments. They also
      reported an inability to share large data sets with one another easily.


      There also was no public resource that could provide combined performance
      data to policymakers or to consumers interested in understanding their
      Internet performance over time. As a result of these conversations, M-Lab
      was founded to help address the core problems experienced by researchers
      and to promote large-scale open source measurement of the Internet.


      M-Lab was [founded](/who/#m-lab-founders) in 2009 by [New America's Open
      Technology Institute](https://www.newamerica.org/oti), the [PlanetLab
      Consortium](https://www.planet-lab.org/), Google, and a group of academic
      researchers.
