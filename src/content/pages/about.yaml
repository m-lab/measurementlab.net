      # Our Story


      ## The history of M-Lab


      **M-Lab was [founded](/who/#m-lab-founders) in 2009 by New America's Open
      Technology Institute, the PlanetLab Consortium, Google, and a group of
      academic researchers.** 


      The project grew out of conversations begun in 2008 by [Vint
      Cerf](http://www.google.com/corporate/execs.html#vint), one of the
      “fathers of the Internet,” who spoke with Internet researchers to better
      understand the challenges they faced when studying Internet performance.


      Researchers identified several key obstacles, including the lack of widely
      deployed servers with sufficient connectivity to support large-scale
      Internet measurement experiments. They also reported difficulties sharing
      large datasets with one another. At the same time, there was no public
      resource capable of providing combined performance data to policymakers or
      to consumers interested in understanding how their Internet performance
      changed over time.


      M-Lab was created in response to these challenges, with the goal of
      addressing the core barriers researchers faced and promoting large-scale,
      open-source measurement of the Internet.
