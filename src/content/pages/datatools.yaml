      # M-Lab Tools and Integrations

      M-Lab supports a growing ecosystem of tools that either run Internet performance tests on the platform or use the open data generated by those tests.

      These tools fall into two main categories: **official M-Lab tools**, built and maintained by the core team, and **community tools and integrations** developed by external organizations using M-Lab’s open data.

      ## Official M-Lab Tools

      These tools are developed and maintained by the M-Lab team. They enable users to run Internet performance tests using M-Lab’s infrastructure and contribute data to the platform.

      [speed.measurementlab.net](http://speed.measurementlab.net) - A public website that allows anyone to run a quick Internet speed test using M-Lab’s NDT tool. Available in multiple languages, it provides a simple and accessible way to test connectivity.  

      [Murakami](https://github.com/m-lab/murakami) - An automated testing tool that runs NDT performance tests approximately every 12 hours and stores results locally. It is designed for researchers and network operators who need continuous, long-term measurement data.

      ### Community Tools Using M-Lab Data

      A wide range of external tools use M-Lab’s open datasets to analyze Internet performance and make connectivity patterns more visible. 

      ### Active Tools

      [Cellwatch](https://cellwatch.cc.gatech.edu/) mobile application - An open-source cellular network measurement suite created by researchers and developers at Georgia Tech, UC Santa Barbara, and Michigan State.

      ![](/src/assets/images/tools/CellWatch.webp)

      [Giga meter](https://meter.giga.global/) - A  powerful desktop application that allows school administrators to monitor and visualize the quality of their institution's connectivity.

      ![](/src/assets/partners/Giga.svg)

      [OONI](https://explorer.ooni.org/chart/mat?test_name=web_connectivity&axis_x=measurement_start_day&since=2026-06-23&until=2026-07-23&time_grain=day)  - The Open Observatory of Network Interference is internet censorship measurement project that runs ndt7 and neubot/dash. While it is no longer an experiment hosted by the M-Lab platform, it still integrates M-Lab tools. 

      ![](</src/assets/images/tools/OONI Probe .webp>)

      [Piecewise](https://github.com/m-lab/piecewise) - A web-based tool that aggregates M-Lab test results and visualizes Internet performance trends, supporting research and policy analysis.

      [SpeedUp America](https://github.com/Hack4Eugene/SpeedUpAmerica) - An open source project that maps Internet speed test data using M-Lab datasets. It combines multiple data sources to show connectivity by geography, provider, time period, and speed.

      [Reverse traceroute web app](https://revtr.ccs.neu.edu/) - Measures the network path back to a user from selected network endpoints, and provides a rich source of information on network routing and topology. *Reverse traceroute is also a test hosted by on the M-Lab platform. *  

      [Wehe app](https://wehe.meddle.mobi/) - Tests if your Internet provides is throttling or blocking Internet traffic generated by popular apps. *Wehe is also a test hoested on the M-Lab platform.* 

      ### Archived Tools

      [I3 Connectivity Explorer](https://i3cex.internet-is-infrastructure.org/) -  Part of the Internet as Infrastructure Project, this platform combines M-Lab data with datasets from U.S. agencies, including the FCC, Census Bureau, EPA, and USDA. It provides maps and visualizations of connectivity across regions, including towns, counties, tribal areas, and school districts.

