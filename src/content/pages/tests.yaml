    content: >-
      M-Lab provides a set of tools that let you explore how your Internet
      connection is performing in real time. By running a test, you can measure
      key aspects of your connection, including speed, latency (delay), network
      blocking, and potential throttling by Internet providers. These tests
      offer a simple way to better understand the quality and reliability of
      your connection.


      ## How M-Lab tests work


      All M-Lab tests use what’s known as active measurement. This means tests
      only run when you choose to start them. M-Lab does not passively monitor
      your connection or track your activity in the background. When you run a
      test, the tool sends and receives synthetic data created specifically for
      measurement. This data is used solely to observe how your network responds
      under controlled conditions.


      M-Lab tests do not access or analyze your everyday Internet use, such as
      emails, browsing, messages, or downloads. The tests also do not collect
      personally identifiable information about your online activity.  




