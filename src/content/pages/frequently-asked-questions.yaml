      ## Data & Privacy

      ### What data is collected when I run a test?

      Tests collect network performance measurements (speed, latency, packet loss), the IP address assigned to your device by your ISP, and basic metadata such as browser version. No personally identifiable information beyond the IP address is collected. All data is published publicly under a [CC0 1.0](https://creativecommons.org/publicdomain/zero/1.0/) license and stored indefinitely to support longitudinal research.

      → [M-Lab Network Annotations: Geolocation, ASNs, and What They Mean](https://kb.measurementlab.net/mlab-annotations-explained)  
      → [Privacy Policy](https://www.measurementlab.net/privacy)

      ### Where is data stored and how can I access it?

      Raw test data is stored in Google Cloud Storage, and NDT data is also queryable via Google BigQuery at no charge to users.

      → [Getting Started with M-Lab Data in BigQuery](https://kb.measurementlab.net/getting-started-bigquery)  
      → [Accessing M-Lab Data Buckets](https://kb.measurementlab.net/accessing-data-buckets)

      ### How precise is the location information in M-Lab data?

      M-Lab annotates tests with geographic information derived from IP address geolocation, which is accurate to approximately the city or county level — not street address or GPS precision. Third-party integrations of M-Lab tests may collect more precise location data independently.

      → [M-Lab Network Annotations: Geolocation, ASNs, and What They Mean](https://kb.measurementlab.net/mlab-annotations-explained)

      ### Can my test data be deleted or anonymized?

      M-Lab collects only your IP address as potentially personal data. Users in the EU, California, and other jurisdictions with applicable privacy regulations may request deletion or anonymization. To exercise these rights, you will need to provide the IP address assigned to you at the time of the test.

      → [Privacy Policy — GDPR and Data Rights](https://www.measurementlab.net/privacy/#privacy-by-design-and-data-minimisation-when-exercising-your-gdpr-rights)

