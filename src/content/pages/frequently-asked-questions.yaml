      # M-Lab Frequently Asked Questions

      For in-depth documentation on how M-Lab works, visit the **[M-Lab Knowledge Base →](https://kb.measurementlab.net)**

      ---

      ## About M-Lab

      ### What is M-Lab?

      Measurement Lab (M-Lab) is the largest open source Internet measurement effort in the world. M-Lab provides publicly available speed tests and network diagnostics, collects the resulting data, and publishes it openly for researchers, policymakers, and the public.

      → [Welcome to M-Lab: Open Internet Measurement](https://kb.measurementlab.net/welcome-to-mlab)

      ### Who runs M-Lab?

      M-Lab is an open source project with contributors from civil society organizations, educational institutions, and private companies. It is a fiscally sponsored project of [Superbloom Desig](https://superbloom.design/)n. M-Lab's infrastructure and operations are supported by [academic institutions, private foundations, and private companies](https://www.measurementlab.net/who#supporting-partners).

      ### How can I contact M-Lab?

      Email [support@measurementlab.net](mailto:support@measurementlab.net) or join the [M-Lab Discuss group](https://groups.google.com/a/measurementlab.net/forum/#!forum/discuss).

      ---

      ## Tests

      ### What measurement tests can I run?

      The most commonly used test is **NDT** (Network Diagnostic Tool), which measures download speed, upload speed, latency, and packet loss. M-Lab also hosts **MSAK** (a configurable multi-stream test), **WeHe** (traffic differentiation detection), **DASH** (video streaming emulation), and **Reverse Traceroute**.

      → [NDT — Network Diagnostic Tool](https://kb.measurementlab.net/test-ndt)  
      → [MSAK — Measurement Swiss-Army Knife](https://kb.measurementlab.net/test-msak)  
      → [WeHe — Traffic Differentiation Detection](https://kb.measurementlab.net/test-wehe)  
      → [Neubot DASH Streaming Test](https://kb.measurementlab.net/test-neubot-dash)

      ### Why are my M-Lab results different from other speed tests?

      Three factors drive differences between tests: (1) M-Lab always tests **off-net** — traffic crosses your ISP's network border, where congestion is most likely to occur; (2) NDT uses a **single TCP stream**, which is more sensitive to network problems than multi-stream tests; (3) Internet routing changes constantly, so results from different moments in time reflect different conditions.

      → [Understanding Speed Test Results](https://kb.measurementlab.net/understanding-speed-test-results) 

      ### Will these tests monitor my private Internet activity?

      No. M-Lab tests measure only synthetic traffic between your device and an M-Lab server. Your browsing history, email, and other private traffic are never collected. See our [Privacy Policy](https://www.measurementlab.net/privacy) and [Acceptable Use Policy](https://www.measurementlab.net/aup) for details.

      ### How do I report issues with M-Lab tests?

      Most tests complete in under 30 seconds. If a test hangs or fails, try again, try from a different network, and check whether a firewall is blocking the connection. If the problem persists, email [support@measurementlab.net](mailto:support@measurementlab.net) with your OS, browser, test name, and any error messages.

      → [Troubleshooting M-Lab Tests](https://kb.measurementlab.net/troubleshooting-mlab-tests) 

