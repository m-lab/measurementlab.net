      # Transparency


      Transparency visualizations showcase ways in which people have used M-Lab
      data to expose what's going on behind the scenes. From ISP throttling to
      deep packet inspection, we invite those interested to shed light on the
      issues, and we highlight the results here.


      ## Network Neutrality Map Using Glasnost Data


      A research team in France analyzed M-Lab's Glasnost data to create an
      intelligible global ranking of net neutrality.


      For more information, go to
      [http://netneutralitymap.org](http://netneutralitymap.org).


      ## Deep Packet Inspection Using Glasnost Data


      A cross-disciplinary team at the Syracuse University School of Information
      Studies and TU Delft dug into M-Lab's Glasnost data to determine not only
      what percentage of ISPs were throttling traffic, but also how many were
      using deep packet inspection to facilitate this throttling.


      ![ISP throttling chart](/images/visualizations/isp-throttle.png)


      For a full description of the study and more results, go to
      [http://dpi.ischool.syr.edu/MLab-Data.html](http://dpi.ischool.syr.edu/MLab-Data.html).
