      # What is the Internet Quality Barometer?

      The Internet Quality Barometer (IQB) is an initiative to redefine how we measure and understand Internet performance to keep pace with evolving technological demands and user expectations.

      # IQB Goals

      - Shift the conversation around Internet Quality beyond “speed"
      - Help decision-makers make sense of the data
      - Use existing, openly available datasets as complementary sources
      - Advocate for the collection of more nuanced metrics
      ![](/src/assets/images/iqb/Policymaker.png)

      # Background & Motivation

      - Internet use cases are growing complex where traditional metrics like “speed” fail to capture the full scope of quality.
      - With various methods for measuring Internet quality are available, it is unclear how to effectively integrate them with one another.
      - While a single metric for optimization offers ‘accessibility’ and ‘data application’ benefits, there is no consensus on what that metric should encompass.



      ![](</src/assets/images/iqb/Speed test to IQB score.svg>)

      # IQB Framework

      - IQB is a comprehensive framework for collecting data and calculating a composite score, the “IQB Score”, which reflects the quality of Internet experience. IQB takes a more holistic approach than “speed tests” and evaluates Internet performance across various use cases (web browsing, video streaming, online gaming, etc.), each with its own specific network requirements (latency, throughput, etc.).
      - To create the IQB framework, M-Lab engaged with more than 60 experts across various fields, including academic network research, public policy, digital inclusion advocacy, Internet service provision, speed test data analysis, content provision, and other related domains from November 2023 to March 2025.
      - Check out the [executive summary](https://www.measurementlab.net/publications/IQB_executive_summary_2025.pdf), [full report](/publications/IQB_report_2025.pdf), or [IMC 2025 poster paper](https://arxiv.org/pdf/2509.19034) for more details  
      ![](</src/assets/images/iqb/Audio Streaming weights.png>)
        # IQB Prototype
        - Following the completion of the framework, the M-Lab team created [a prototype of the IQB tool to calculate the single metric.](https://iqb.mlab-staging.measurementlab.net/)
        - The IQB web app prototype consists of two main interfaces designed to explore and visualize IQB scores.
        - The first interface allows users to test the IQB score using their own measurement values or to experiment with hypothetical values to observe how scores change. Users can adjust parameters such as dataset weights, network requirements per use case, use case weights, and thresholds per dataset or use case.
        - The second interface provides global visualizations of precomputed IQB scores for all countries and their subdivisions color-coded based on their IQB score.  
        ![](</src/assets/images/iqb/iqb drc.jpeg>)
        # IQB Going Forward
        - M-Lab hope to continue refining the IQB framework and prototype, as well as establish sustainable governance.
        - IQB is built to be adaptable and iterative and we are interested in tailoring IQB to specific use cases such as in schools and rural areas.
        - If you're interested in working together, [let us know](mailto:hello@measurementlab.net)!
