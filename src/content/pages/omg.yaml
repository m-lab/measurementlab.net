      # **OMG 4 — Fourth Convening (September 8–12, 2025, Estoril, Portugal)**

      ## **Open Measurement Village (Sept 8–10)**

      Before the formal OMG convening, the groups co-hosted an Open Measurement Village at the Global Gathering (GG) — a major gathering of the digital rights community. At the Village, OMG groups ran booths, facilitated circle discussions, and hosted an interactive game called 'Are You My Measurement Tool?' to help attendees understand the differences and complementary uses of each group's tools and datasets.

      A key insight from this community engagement: balancing innovation in Internet measurement with accessibility for non-technical users remains a central challenge. Open measurement tools must keep pace with increasingly sophisticated Internet interference while also remaining understandable to the civil society organizations that need them most.

      ## **New OMG User Guide**

      In direct response to feedback gathered at the Global Gathering, the four OMG groups collaborated on a new public resource: the OMG User Guide. This guide is designed to help users and organizations determine which measurement tool is best suited to their needs, and how to compare or combine data across the four groups.

      ## **OMG 4 Internal Sessions (Sept 11–12) — Key Takeaways**

      After the Global Gathering, the OMG groups held two days of internal sessions. Three overarching themes ran through the entire convening: that the groups face shared challenges, that meeting those challenges requires more coordination, and that the work can only continue if the organizations become more sustainable.

      **Theme 1: Shared Challenges**

      The biggest shared challenge was that every group is trying to achieve a large mission with limited resources. Common operational pressures included:

      - Remote, globally distributed teams across many time zones, making it hard to stay connected and collaborate effectively day-to-day.
      - Chronic understaffing — all groups have too much work and not enough people, with most staff multi-tasking and taking on responsibilities outside their core expertise.
      - Fundraising and donor management consume significant time, sometimes from staff who are not specialists in that area. Most staff are contractors with limited stability, and most groups lack operational teams to handle finance, HR, or organizational well-being.
      - Unpredictable workflows and high-pressure missions create burnout risk. Most teams have single points of failure — if one person is out, key projects stall.
      - Keeping up with maintenance and troubleshooting often means postponing development of new features.
      - Managing user communities with varied levels of technical expertise and different — sometimes conflicting — needs and threat models.

      The groups agreed they need to narrow their scope, focus on what matters most, and explicitly include maintenance and operational costs in their budgets rather than treating them as invisible overhead.



      **Theme 2: Increase Coordination**

      The groups outlined both immediate and longer-term plans for working more closely together:

      - Short term: create cross-organization communication channels, establish thematic working groups (e.g. research, operations), hold regular joint virtual meetings, and build a centralized hub for sharing knowledge resources with the open measurement community. An initial help channel has already been set up on the public OONI Slack.
      - Long term: host OMG events alongside major conferences, conduct joint research studies, develop complementary datasets, pool resources, build the capacity of global digital rights researchers, and create a more detailed shared tool to help people navigate across the different measurement platforms.
      - Groups also identified specific coordination improvements for censorship monitoring and rapid response — including leveraging existing coalitions like #KeepItOn, sharing internal data dashboards with trusted partners, and training communities in regions with low measurement coverage to be ready to mobilize during Internet disruptions.

      **Theme 3: Sustainability**

      The groups reviewed the current funding landscape, noting a significant loss of U.S. government funding for Internet freedom initiatives with no single equivalent replacement in sight. Despite much lower resources, open measurement is more important than ever. Key sustainability priorities identified:

      - Focus on demonstrable impact rather than discrete activities — connect open measurement work to broader trends in policy and technology to maintain donor and public interest.
      - Data is both a strength and a vulnerability. Each group holds large amounts of complementary data. Combined, the OMG groups could offer a uniquely comprehensive open data resource representing the Internet as a whole — but the cost to host and publish data will only increase.
      - AI was characterized as both a threat (further straining limited infrastructure and resources) and an opportunity (potentially unlocking new analytical capabilities and partnerships).
      - Shrinking civic space and strained teams threaten the capacity to report on censorship events. Organizational resilience must improve so that the collapse of one institution or donor does not destabilize the entire open measurement ecosystem.
      - Groups should become more proactive in fundraising and more resilient by diversifying funding sources and sharing partnerships and networks across organizations.

