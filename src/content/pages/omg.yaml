      # **OMG 1 — First Convening (June 2024)**

      The first gathering launched the OMG project, giving each organization the opportunity to introduce itself and share details about its platforms, tools, and data. The primary goal was to build a shared foundation of understanding across groups that had previously operated mostly in parallel.

      Key outcomes from OMG 1 included groups learning the specifics of each other's measurement approaches, identifying overlapping use cases, and beginning to surface common operational challenges. The full public report from this event is available on the M-Lab website.

      **1. Shared Challenges**

      Across all three days, participants identified challenges that cut across all four organizations:

      - Common dependencies — All groups rely on similar infrastructure (cloud provider credits, donated servers) and third-party datasets. These dependencies are vulnerable to shifts outside any group's control.
      - Blind spots — Each group is aware of Internet behaviors they do not currently measure. There is an ongoing tension between measuring what is currently relevant and maintaining longitudinal consistency. The groups agreed that being transparent about blind spots matters not just for their own work, but for their users.
      - Communications and rapid response burden — Censorship measurement requires deep technical and sociopolitical expertise, yet making that work accessible to journalists and advocates is core to the mission. This balance demands significant time and labor, especially during live censorship events when community members also frequently ask groups to validate their own conclusions.

       **2. Existing Complementary Efforts Worth Sustaining**

      - Much of what the groups already do supports one another. Participants identified several collaborative patterns to preserve and scale:
      - Rapid response coordination — OONI, IODA, and Cloudflare Radar already coordinate regularly during network interference events, often working alongside Access Now's #KeepItOn coalition and Kentik. These partnerships keep groups in close contact and build familiarity with each other's tools.
      - Documenting censorship events — Groups frequently collaborate on post-event documentation, enabling deeper data analysis than rapid response allows. Participants expressed pride in these efforts and a desire for more resources to pursue them.
      - Complementary datasets — Because each group uses different measurement techniques, they can cross-verify findings.

        

      **4. Opportunities for Deeper Collaboration**

      - Shared measurement expertise — The 101 presentations and data dives were identified as the most valuable parts of the convening. The goal going forward is for each group to become a genuine champion and expert in the others' tools — able to direct researchers to the right dataset for any given question, and to collaboratively report on network interference events.
      - Shared resources — Given overlapping infrastructure needs (cloud credits, bare metal servers, data analysis support, fundraising), there is interest in exploring what a more integrated approach to resource sharing could look like.
      - Shared Theory of Change — All groups face strategic decisions about where their data has the most impact: academic research, legal proceedings, journalism, or policy. Aligning on a common vision for how to engage with these different pathways could amplify collective reach and give shared purpose to the work.

         

      # **OMG 2 — Second Convening (December 2024)**

      The second gathering took place over three days at Georgia Tech's Internet Intelligence Lab in Atlanta, hosted in collaboration with the IODA project. Rather than re-introductions, this convening focused on deepening mutual knowledge so participants could become genuine advocates for one another's work.

       Four key themes emerged as priority areas for collaboration:

       **1. Uncertainty about the funding landscape**

      Shifts in political leadership globally put historic funding sources at risk for each group. Participants recognized the need to identify alternative revenue streams and adapt to changing donor mandates.

       **2. Evolving infrastructural constraints**

      Internet measurement datasets are growing rapidly, requiring more resources to maintain and keep publicly accessible. Emerging technologies like AI place further pressure on finite infrastructure. Groups discussed what data to prioritize making available publicly and how to manage archival storage.

       **3. Infrastructure resilience**

      Each organization faces distinct but related risks: DDoS attacks, government-ordered blocks, software dependency failures, understaffing, and potential data loss. Sharing these challenges highlighted opportunities for mutual support and joint resilience-building.

       **4. Theory of Change for an open Internet**

      All four groups agreed on a shared vision: a free, open, transparent, accountable, resilient, and equitable Internet. A SWOT (Strengths, Weaknesses, Opportunities, Threats) analysis helped identify entry points for collective action. The groups committed to refining a shared Theory of Change in future convenings.

      # **OMG 3 — Public AMA Event (June 25, 2025)**

      The third OMG convening took a different form: a public virtual event open to the broader Internet freedom community. Each of the four groups presented for 30 minutes on their platforms, recent tool updates, and future plans, followed by a live Q&A session.

      This shift toward a public format allowed the OMG groups to share previews of upcoming changes directly with the community and gather real-time feedback before those changes went live. At its peak, around 60 participants joined from across the world.

      The event was aimed especially at advocacy organizations, digital rights researchers, anti-censorship tool developers, journalists, lawyers, activists, policymakers, and funders. A full report with presentation summaries and key community questions is available on the M-Lab publications page, and recordings of all four sessions are publicly available on YouTube.

