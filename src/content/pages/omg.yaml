      # **What Is the Open Measurement Gathering?**

      The Open Measurement Gathering (OMG) was a series of convenings that brought together four open Internet and censorship measurement organizations — Measurement Lab (M-Lab), Censored Planet, IODA (Internet Outage Detection and Analysis), and OONI (Open Observatory of Network Interference) — to build deeper trust, coordination, and collaboration.

       The program ran from 2024 to 2025 and funded by the Open Technology Fund (OTF). OMG’s overarching goal was to help open Internet measurement groups support the Internet freedom community more sustainably and efficiently by understanding each other's tools and data better, and by tackling shared challenges together.

      **The four participating organizations:**

      •       Measurement Lab (M-Lab) — measures Internet performance globally

      •       [Censored Planet](https://censoredplanet.org/) — monitors Internet censorship using remote measurement techniques

      •       [IODA](https://ioda.inetintel.cc.gatech.edu/) — detects Internet outages and disruptions in near real-time

      •       [OONI](https://ooni.org/) — documents Internet censorship through a global network of probes



      # **At a Glance: The Four Convenings**

      The OMG project unfolded across four gatherings between June 2024 and September 2025, each building on the last:

      OMG 1  June 11th-13th, 2024 at Georgia Tech (Atlanta)  
      Kick-off; groups introduced, tools & data shared, common challenges surfaced

      OMG 2 December 10-12, 2024 at Georgia Tech (Atlanta)  
      Deepened understanding; identified shared challenges around funding, infrastructure & Theory of Change

      OMG 3 June 25, 2025 a [Public Virtual AMA Event](https://www.youtube.com/playlist?list=PLEszjns3sXFGsa42CYPxrQrFPAfA7v71v)  
      Public-facing event; each group presented updates & took live Q&A (~60 attendees worldwide)

      OMG 4 Sept 8–12, 2025 at Estoril, Portugal  
      Final convening; Open Measurement Village at Global Gathering; produced OMG User Guide

      # **Overall Impact of the OMG Program**

      Across the four convenings, the OMG program achieved something significant: it moved four organizations from working in parallel to working in coordination. The practical outcomes include:

      -   Deeper mutual understanding of each group's platforms, data pipelines, tools, and user communities
      - Stronger interpersonal relationships and trust across teams
      - A default habit of collaboration — groups now routinely consider incorporating each other's data and keeping each other's communities informed
      - Joint public events that benefit the broader Internet freedom ecosystem
      - A new shared public resource (the OMG User Guide) to help civil society navigate these tools
      - A foundation for ongoing coordination even after the formal funding period ends

       The OMG program recognized that the challenges facing open Internet measurement — from funding uncertainty to infrastructure pressure to government interference — cannot be solved by any single group alone. By building trust and coordination across organizations, the OMG project has strengthened the ecosystem's collective capacity to defend a free and open Internet.



