      **You can be a hero - use Internet measurement data to solve real-world challenges!**

      Internet measurement groups: Measurement Lab, Internet Society, UNICEF Giga, IIJ Research Laboratory, Internet Intelligence Lab; IODA, Cloudflare Radar, Internet History Initiative, and OONI will hold a hackathon to examine critical challenges in connectivity and Internet measurement at scale. 

      Each Internet measurement group will provide a list of challenges as well as a list of open-ended questions to participants to help solve Internet measurement challenges on a global platform. 

      **Date:** October 12, 2026  
      **Location:** Karlsruhe, Germany   
      **Time**: 9:00 - 17:00  
      **[Agenda and challenges available on GitHub](https://github.com/m-lab/open-measurement-hackathon/blob/main/2026/README.md).**

      [Questions or want to participate?](mailto:hello@measurementlab.net)
