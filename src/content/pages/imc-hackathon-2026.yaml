      **IMC 2026 Hackathon! You can be a hero - use Internet measurement data to
      solve real-world challenges!**


      For the last four years, Measurement Lab has run a hackathon in
      partnership with other Internet measurement groups on the sidelines of the
      Internet Measurement Conference. We're coming back again this year to host
      a hackathon to examine critical challenges in connectivity and Internet
      measurement at scale.


      **Date:** October 12, 2026  

      **Location:** Karlsruhe, Germany   

      *Venue to be confirmed* 


      **Names and affiliations of organizers**


      - Pavlos Sermpezis, Director, Technical Lead, Measurement Lab

      - Maria Antonia Bravo, Technology Programme Manager, UNICEF Giga 

      - Loqman Salamatian, Post-doc, *Columbia University*

      - Amreesh Phokeer, Internet Measurement and Data Expert, ISOC

      - Romain Fontugne, Deputy Director, IIJ Research Laboratory

      - Zachary Bischof, Senior Research Scientist, Georgia Institute of
      Technology (Internet Intelligence Lab; IODA)

      - Lai Yi, Head of Cloudflare Radar, Cloudflare


      **More details, registration, and agenda coming soon!**  


      [Questions or want to participate?](mailto: leads@measurementlab.net)
