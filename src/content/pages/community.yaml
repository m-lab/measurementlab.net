      ## The Connectivity Community of Practice


      Measurement Lab runs a Connectivity Community of Practice In partnership
      with UNICEF Giga. We work with Giga to strengthen how connectivity is
      measured and understood for public facilities, especially schools, using
      open measurement approaches that reflect on-the-ground conditions.


      The CCoP builds on that shared foundation. It brings together researchers,
      network engineers, implementers, and policymakers to advance measurement
      approaches that are:


      - Technically rigorous

      - Globally comparable

      - Practical for real-world connectivity contexts, including underserved
      regions


      At its core, the CCoP reflects a shared commitment to openness in data, in
      tools, and in collaboration. As the community grows, we look forward to
      shaping inclusive participation and governance models with contributors,
      ensuring this work remains durable, representative, and grounded in shared
      priorities.


      We host regular meetings for the CCoP to share updates, resources, and
      problem solve together. 


