      # Contact M-Lab


      Do you have a question or comment about M-Lab? Do you need to report an
      issue or bug?


      Search our answers to commonly asked questions on our [FAQ
      page](https://mlab.draftlab.dev/frequently-asked-questions/)
      [](frequently-asked-questions)or email us at
      [support@measurementlab.net](mailto:support@measurementlab.net) and our
      team will get back to you.


      If you are interested in discussing your question or issue with others in
      the M-Lab community, join our Google Group, [M-Lab
      Discuss](https://groups.google.com/a/measurementlab.net/forum/#!forum/discuss),
      where the community of M-Lab users interact. Joining this group also
      provides you free access to our data, so we highly recommend that you join
      this list and ask questions.


      M-Lab operates as a community-based effort, receiving in-kind, staffing
      and direct support from our partners. Our focus is providing a stable,
      globally distributed platform from which researchers, public policy makers
      and the public can get data on the state and performance of the Internet
      and to make our tests' data publicly available for analysis, policy
      making, and monitoring. This is an immense effort conducted by a small
      number people. If you would like to contribute to this effort, please
      learn how you or your organization can [get involved](/contribute/).
