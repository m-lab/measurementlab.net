          df_test_counts, 'day', 'count',
          fig_by='metro', axes_by='site', group_by='discards',
          suptitle='NDT Test Counts (with or without discards)',
          label='{group}',
          title='{axis}',
          axes=(3, 2), figsize=(12, 10),
          ylim=(-200, 30000),
          xlim=(pd.to_datetime("2016-05-31"), pd.to_datetime("2018-08-01")),
