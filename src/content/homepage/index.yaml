    value: 6+ billion
  - label: Tests per day
    value: 4 million
  - label: Data
    value: '9 PB '
  - label: Servers
    value: 400+
sections:
  - type: card
    background:
      color: white
      type: full
    title: What we do
    description: >-
      Founded in 2009, Measurement Lab (M-Lab) is an open platform for studying
      Internet performance and neutrality over time. We provide public,
      transparent data to empower researchers, policymakers, and open Internet
      advocates to make informed decisions about Internet infrastructure and
      policies.

      M-Lab is a fiscally sponsored project of the Code for Science & Society.
