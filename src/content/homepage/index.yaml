title: Measure the Internet. Save the data. Make it universally accessible and
  helpful.
backgroundImage: /src/assets/Group 55-1.png
stats:
  - label: Internet measurement tests
    value: 6+ billion
  - label: Tests per day
    value: 4 million
  - label: Data
    value: "9 PB "
  - label: Servers
    value: 400+
sections:
  - type: blog_roll
    background:
      color: gray
      type: full
    title: Latest News
    limit: 3
    showMore: true
  - type: card
    background:
      color: white
      type: full
    title: What we do
    description: Founded in 2009, Measurement Lab (M-Lab) is an open platform for
      studying Internet performance and neutrality over time. We provide public,
      transparent data to empower researchers, policymakers, and open Internet
      advocates to make informed decisions about Internet infrastructure and
      policies. M-Lab is a fiscally sponsored project of Superbloom Design.
    cards:
      - title: Global Testing Platform
        content: A network of 425+ servers in 75+ metro areas, hosted at interconnection
          points and cloud networks.
        color: speed
        icon: measurement
        button:
          variant: primary
          size: md
          text: Check out the Platform
          href: /platform-status
      - title: "Internet Measurement Data "
        content: A large-scale Internet measurement data, consolidated into an open,
          accessible pipeline.
        color: supporting1
        icon: insights
        button:
          variant: secondary
          size: md
          text: Dive into the Data
          href: /data
      - title: Community Engagement
        content: Provide technical advice, hold convenings, and bring together
          stakeholders to foster knowledge exchange and collaboration.
        color: secondary
        icon: community
        button:
          variant: primary
          size: md
          text: Join the Community
          href: /community
    buttons:
      - variant: primary
        size: md
        text: FAQ
        href: /frequently-asked-questions
  - type: speed_test
    background:
      color: primary-dark
      type: full
    title: Run an NDT test
    description: Diagnose the performance of your broadband connection with M-Lab's
      Network Diagnostics Test (NDT).
  - type: infrastructureMap
    background:
      color: white
      type: full
    title: Visualisations and more
    description: M-Lab provides software integrations, dashboards, measurements,
      data APIs, and more to assist in network measurements.
  - type: featured_partners
    background:
      color: white
      type: full
    title: Bringing people together to strengthen the Internet
    description: M-Lab's partners donate the core infrastructure that make
      measurements possible. Join the movement that enables a diversified,
      resilient measurement network by donating data or infrastructure.
    button:
      variant: primary
      size: md
      text: Partner WIth Us
      href: /partners
