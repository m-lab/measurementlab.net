# .github/workflows/linkcheck.yml

# Github Action that checks all links on the site build,
# and updates a GH issue with the current state of link quality
# has two options: [linkcheck] for internal-only (skips network, very fast)
# and [linkcheck-full] that includes all links, and is quite slower
# Can be triggered with a commit, by adding
# [linkcheck]
# or [linkcheck-full]
# to the commit message.
# It can also be triggered manually from Github Actions.
name: Link check

on:
  workflow_dispatch:
    inputs:
      offline:
        description: "Internal links only (skip network)"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[linkcheck]') ||
      contains(github.event.head_commit.message, '[linkcheck-full]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            offline="${{ inputs.offline }}"
          elif [[ "${{ github.event.head_commit.message }}" == *"[linkcheck-full]"* ]]; then
            offline=false
          else
            offline=true
          fi
          echo "offline=$offline" >> "$GITHUB_OUTPUT"
          [ "$offline" = "true" ] && echo "flag=--offline" >> "$GITHUB_OUTPUT" || echo "flag=" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # We use Lychee for link checking
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail: false
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            ${{ steps.mode.outputs.flag }}
            'dist/**/*.html'

      # The issue is located before the report is built, so the previous run's
      # counts are available to compute the delta line in the header.
      - name: Find existing report issue
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list \
            --label linkcheck --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Counts from the previous run, read back out of the marker its report left in
      # the issue body. Absent on issues written before that marker existed, and on a
      # freshly opened issue - the delta is simply omitted in those cases.
      - name: Read previous counts
        id: prev
        if: steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh issue view ${{ steps.existing.outputs.number }} \
            --json body --jq .body > prev-body.md

          line=$(grep -o '<!--counts [^>]*-->' prev-body.md | head -1 || true)

          if [ -z "$line" ]; then
            echo "No counts marker on issue #${{ steps.existing.outputs.number }} - delta skipped."
            exit 0
          fi

          echo "Previous: $line"
          for kv in $(printf '%s' "$line" | sed -e 's/<!--counts //' -e 's/-->//'); do
            printf '%s\n' "$kv" >> "$GITHUB_OUTPUT"
          done

      # We add some metadata to Lychee's report, like time of last run,
      # and clean it up a bit
      - name: Build report
        run: |
          set -euo pipefail

          if [ "${{ steps.mode.outputs.offline }}" = "true" ]; then
            mode="internal only"
          else
            mode="internal + external"
          fi

          # Strip the runner's absolute path prefix
          sed -e "s#file://${GITHUB_WORKSPACE}/dist##g" \
              -e "s#${GITHUB_WORKSPACE}/##g" \
              ./lychee/out.md > cleaned.md

          internal=$(grep -cE '^\* \[[^]]+\] <(file://|/)' ./lychee/out.md || true)
          external=$(grep -cE '^\* \[[^]]+\] <https?://' ./lychee/out.md || true)

          if [ "${{ steps.mode.outputs.offline }}" = "true" ]; then
            checked=internal
          else
            checked=both
          fi

          # Delta against the previous run. External is only comparable when *both*
          # runs actually requested external links - an offline run's external count
          # is structurally 0, not an improvement - so `checked` gates it on each side.
          prev_internal="${{ steps.prev.outputs.internal }}"
          prev_external="${{ steps.prev.outputs.external }}"
          prev_checked="${{ steps.prev.outputs.checked }}"

          # "**12 fewer**" / "**3 more**" / "**No net change** in"
          headline() {
            if [ "$1" -lt 0 ]; then printf '**%d fewer**' "$(( -$1 ))"
            elif [ "$1" -gt 0 ]; then printf '**%d more**' "$1"
            else printf '**No net change** in'
            fi
          }

          # "12 fewer" / "3 more" / "unchanged"
          part() {
            if [ "$1" -lt 0 ]; then printf '%d fewer' "$(( -$1 ))"
            elif [ "$1" -gt 0 ]; then printf '%d more' "$1"
            else printf 'unchanged'
            fi
          }

          delta=""
          if [ -n "$prev_internal" ]; then
            di=$(( internal - prev_internal ))
            if [ "$checked" = "both" ] && [ "$prev_checked" = "both" ]; then
              de=$(( external - prev_external ))
              if [ "$di" -eq 0 ] && [ "$de" -eq 0 ]; then
                delta="No change since the last run."
              else
                delta="$(headline $(( di + de ))) broken links since the last run"
                delta="${delta} - internal: $(part "$di"), external: $(part "$de")."
              fi
            elif [ "$di" -eq 0 ]; then
              delta="No change in broken internal links since the last run."
            else
              delta="$(headline "$di") broken internal links since the last run."
            fi

            # Only worth saying when *this* run checked external and so a reader would
            # otherwise expect an external figure. When this run is offline the
            # [!NOTE] callout below already explains the omission.
            if [ "$checked" = "both" ] && [ "$prev_checked" != "both" ]; then
              delta="${delta} _(External not compared - the previous run skipped it.)_"
            fi
          fi

          notice=""
          if [ "${{ steps.mode.outputs.offline }}" = "true" ]; then
            counts="**${internal} internal** · external: not checked"
            notice=$(printf '%s\n' \
              '> [!NOTE]' \
              '> This run checked **internal links only**. To include external links' \
              '> push a commit tagged `[linkcheck-full]`.')
          else
            counts="**${internal} internal** · **${external} external**"
          fi

          # Collapse each per-file section, with its issue count in the summary
          awk '
            function flush() {
              if (!open) return
              printf "<details><summary><code>%s</code> — %d issue%s</summary>\n\n", title, n, (n==1?"":"s")
              for (i = 1; i <= c; i++) print body[i]
              printf "\n</details>\n\n"
              c = 0; n = 0
            }
            /^### / { flush(); title = substr($0,5); sub(/^Errors in /, "", title); open = 1; next }
            open && /^\* / { body[++c] = $0; n++; next }
            open { body[++c] = $0; next }
            { print }
            END { flush() }
          ' cleaned.md > sections.md

          # Kept unheadered for the archive comparison in the next run
          cp sections.md ./lychee/sections-only.md


          # Everything here sits *before* <!--report-start-->, which the archive step
          # diffs from - so the delta line and the counts marker never register as a
          # content change and spam archive comments.
          if [ "$checked" = "both" ]; then
            marker="<!--counts internal=${internal} external=${external} checked=both-->"
          else
            marker="<!--counts internal=${internal} external=na checked=internal-->"
          fi

          {
            echo "${counts} · mode: ${mode}"
            echo
            if [ -n "$delta" ]; then
              echo "$delta"
              echo
            fi
            echo "_Last run: $(date -u '+%Y-%m-%d %H:%M UTC') · commit \`${GITHUB_SHA:0:7}\` · [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
            echo
            if [ -n "$notice" ]; then
              echo "$notice"
              echo
            fi
            echo "$marker"
            echo "<!--report-start-->"
            cat sections.md
          } > ./lychee/report.md

          # Issue bodies cap at 65,536 characters; the API rejects rather than truncates
          if [ "$(wc -c < ./lychee/report.md)" -gt 60000 ]; then
            head -c 60000 ./lychee/report.md > truncated.md
            printf '\n\n_Report truncated — see the run log for the full output._\n' >> truncated.md
            mv truncated.md ./lychee/report.md
          fi

      # We update the current issue with the new run,
      # and copy the old run in comments
      - name: Archive previous report
        if: steps.lychee.outputs.exit_code != 0 && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh issue view ${{ steps.existing.outputs.number }} \
            --json body --jq .body > previous.md

          # Everything after the marker, so the header's fresh timestamp is ignored
          sed -n '/<!--report-start-->/,$p' previous.md | tail -n +2 > previous-sections.md

          if diff -q previous-sections.md ./lychee/sections-only.md >/dev/null 2>&1; then
            echo "Report unchanged — skipping archive."
            exit 0
          fi

          {
            echo "**Previous report** — archived $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            sed 's/^\( *\)- \[[ x]\] /\1- /' previous.md
          } > archive.md

          gh issue comment ${{ steps.existing.outputs.number }} --body-file archive.md

      - name: Update or open report issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links report
          content-filepath: ./lychee/report.md
          issue-number: ${{ steps.existing.outputs.number }}
          labels: linkcheck, automated

      - name: Close report issue when clean
        if: steps.lychee.outputs.exit_code == 0 && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ steps.mode.outputs.offline }}" = "true" ]; then
            comment="All **internal** links passing as of ${{ github.sha }}. External links were not checked in this run."
          else
            comment="All links passing as of ${{ github.sha }}."
          fi

          gh issue close ${{ steps.existing.outputs.number }} --comment "$comment"
