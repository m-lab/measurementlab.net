timeout = 20
max_retries = 3
max_concurrency = 32

exclude = [
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  # skip netlify's preprocessed images, we will still catch broken images in the astro build process
  '/\.netlify/images',

  # --- crawler blocking ---------------------------------------------------------
  # The entries below 403 (forbid access) or refuse automated clients,
  # so they are removed from the link checker since they aren't giving relevant information
  # If adding new URLS, first confirm that the test returns 403, then ideally check the page
  # manually to make sure it is actually blocked.
  '^https?://([^/]+\.)?x\.com(/|$)',
  '^https?://([^/]+\.)?twitter\.com(/|$)',
  '^https?://([^/]+\.)?fcc\.gov(/|$)',
  '^https?://([^/]+\.)?acm\.org(/|$)',
  '^https?://([^/]+\.)?ssrn\.com(/|$)',
  '^https?://([^/]+\.)?nytimes\.com(/|$)',
  '^https?://([^/]+\.)?medium\.com(/|$)',
  '^https?://([^/]+\.)?doi\.org(/|$)',
  '^https?://([^/]+\.)?tandfonline\.com(/|$)',
  '^https?://radar\.cloudflare\.com(/|$)',
  '^https?://about\.att\.com(/|$)',
  '^https?://([^/]+\.)?rnp\.br(/|$)',
  '^https?://([^/]+\.)?ipysvenezuela\.org(/|$)',
  '^https?://([^/]+\.)?intgovforum\.org(/|$)',
  '^https?://([^/]+\.)?nysenate\.gov(/|$)',
  '^https?://([^/]+\.)?ilsr\.org(/|$)',
  '^https?://([^/]+\.)?digitalinclusion\.org(/|$)',
  '^https?://([^/]+\.)?ufsc\.br(/|$)',
  '^https?://([^/]+\.)?uoguelph\.ca(/|$)',
  '^https?://([^/]+\.)?samknows\.com(/|$)',
  # TLS quirks: grnet.gr serves a mismatched cert on www., csuc.cat resets non-browser TLS handshakes
  '^https?://([^/]+\.)?grnet\.gr(/|$)',
  '^https?://([^/]+\.)?csuc\.cat(/|$)',
]

# 429 (rate limited) 429 is accepted because it means the server
# answered and asked us to slow down.
# 202 is accepted because some publishers (e.g. IEEE Xplore) answer a
# bot challenge with 202 while the page itself exists.
accept = ["200", "202", "206", "429"]

user_agent = "Mozilla/5.0 (compatible; lychee)"

cache = true
max_cache_age = "1d"
