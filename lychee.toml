timeout = 20
max_retries = 3
max_concurrency = 32

exclude = [
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  # skip netlify's preprocessed images, we will still catch broken images in the astro build process
  '/\.netlify/images',

  # --- crawler blocking ---------------------------------------------------------
  # These hosts answer real browsers but refuse automated clients: Cloudflare JS
  # challenges ("Just a moment..." / "Attention Required"), Akamai "Access Denied",
  # or JS-only rendering. A 403 from them means the server is up and deliberately
  # turning us away -- the link works for readers, so counting it as broken is noise.
  #
  # The entries below 403 (forbid access) or refuse automated clients,
  # so they are removed from the link checker since they aren't giving relevant information
  # If adding new URLS, first confirm that the test returns 403, then ideally check the page
  # manually to make sure it is actually blocked.
  '^https?://([^/]+\.)?x\.com(/|$)',              # verified in browser; 403s only from CI IPs
  '^https?://([^/]+\.)?twitter\.com(/|$)',        # same platform, same behaviour
  '^https?://([^/]+\.)?fcc\.gov(/|$)',            # verified in browser (www, data, apps)
  '^https?://([^/]+\.)?acm\.org(/|$)',            # verified in browser; Cloudflare on queue.
  '^https?://([^/]+\.)?ssrn\.com(/|$)',           # Cloudflare JS challenge
  '^https?://([^/]+\.)?nytimes\.com(/|$)',        # JS / ad-block wall
  '^https?://([^/]+\.)?medium\.com(/|$)',         # Cloudflare "Attention Required"
  '^https?://([^/]+\.)?doi\.org(/|$)',            # Cloudflare JS challenge
  '^https?://([^/]+\.)?tandfonline\.com(/|$)',    # Cloudflare JS challenge
  '^https?://radar\.cloudflare\.com(/|$)',        # Cloudflare JS challenge
  '^https?://about\.att\.com(/|$)',               # Akamai "Access Denied"
  '^https?://([^/]+\.)?rnp\.br(/|$)',             # Cloudflare JS challenge
  '^https?://([^/]+\.)?ipysvenezuela\.org(/|$)',  # Cloudflare JS challenge
  '^https?://([^/]+\.)?intgovforum\.org(/|$)',    # Cloudflare JS challenge
  '^https?://([^/]+\.)?nysenate\.gov(/|$)',       # JS-only rendering; page itself resolves
  '^https?://([^/]+\.)?ilsr\.org(/|$)',            # Cloudflare JS challenge
  '^https?://([^/]+\.)?digitalinclusion\.org(/|$)',# Cloudflare "Attention Required"
]

# 429 (rate limited) 429 is accepted because it means the server
# answered and asked us to slow down.
accept = ["200", "206", "429"]

user_agent = "Mozilla/5.0 (compatible; lychee)"

cache = true
max_cache_age = "1d"
